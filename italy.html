<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f3ec" />
<title>Italy — Two Weeks · Oct 2026</title>
<meta name="description" content="Interactive map + day-by-day itinerary for a two-week Italy trip." />

<!-- Leaflet (CDN dependency; needs internet) -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

<!-- fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap" />

<!-- app styles -->
<link rel="stylesheet" href="./assets/style.css?v=98b0d80f" />
</head>
<body>
  <header class="top" id="top"><!-- filled by app.js from TRIP.meta --></header>

  <div class="layout">
    <div class="mapwrap">
      <div id="map"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="itin" id="itin"><!-- filled by app.js from TRIP.bases --></div>
  </div>

  <div class="foot">Open in any browser · map data © OpenStreetMap contributors</div>

  <!-- Leaflet lib -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- vector basemap (OpenFreeMap tiles via MapLibre; app.js falls back to OSM raster) -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>

  <!-- DATA (edit these to change the trip; app.js never needs touching) -->
  <script src="./trips/italy/trip.js?v=98b0d80f"></script>
  <script src="./trips/italy/routes.js?v=98b0d80f"></script>

  <!-- LOGIC -->
  <script src="./assets/app.js?v=98b0d80f"></script>
</body>
</html>
